<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF → JPG Converter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh; color: #e2e8f0; padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 2rem; background: linear-gradient(90deg,#38bdf8,#818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: #94a3b8; margin-top: 6px; font-size: .95rem; }

  #dropZone {
    border: 2px dashed #475569; border-radius: 16px; padding: 48px 24px;
    text-align: center; cursor: pointer; transition: .25s;
    background: rgba(255,255,255,.03);
  }
  #dropZone.dragover { border-color: #38bdf8; background: rgba(56,189,248,.08); transform: scale(1.01); }
  #dropZone .icon { font-size: 3rem; margin-bottom: 10px; }
  #dropZone strong { color: #38bdf8; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    background: rgba(255,255,255,.05); border: 1px solid #334155;
    border-radius: 12px; padding: 14px 18px; margin: 18px 0;
  }
  .controls label { font-size: .85rem; color: #94a3b8; display: block; margin-bottom: 4px; }
  select, input[type=range] { width: 150px; accent-color: #38bdf8; }
  select { background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 6px; padding: 6px 8px; }

  #progressWrap { display: none; margin: 16px 0; }
  .bar { height: 8px; background: #334155; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#38bdf8,#818cf8); transition: width .2s; }
  #progressText { font-size: .85rem; color: #94a3b8; margin-top: 6px; }

  .actions { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  button {
    border: none; border-radius: 10px; padding: 11px 20px; font-size: .95rem;
    font-weight: 600; cursor: pointer; transition: .2s;
  }
  .btn-primary { background: linear-gradient(90deg,#38bdf8,#818cf8); color: #0f172a; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #475569; }
  .btn-ghost:hover { color: #e2e8f0; border-color: #64748b; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card {
    background: rgba(255,255,255,.05); border: 1px solid #334155;
    border-radius: 12px; overflow: hidden; animation: pop .3s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px);} to { opacity:1; transform:none;} }
  .card img { width: 100%; height: 200px; object-fit: contain; background: #fff; display: block; }
  .card .meta { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
  .card .meta span { font-size: .8rem; color: #94a3b8; }
  .card a {
    font-size: .8rem; text-decoration: none; color: #38bdf8;
    border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 6px; transition: .2s;
  }
  .card a:hover { background: #38bdf8; color: #0f172a; }
  footer { text-align: center; color: #64748b; font-size: .8rem; margin-top: 36px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📄 PDF → JPG Converter</h1>
    <p>100% private — your PDF is converted entirely inside your browser.</p>
  </header>

  <div id="dropZone">
    <div class="icon">📤</div>
    <p><strong>Click to browse</strong> or drag & drop a PDF here</p>
  </div>
  <input type="file" id="fileInput" accept="application/pdf" hidden />

  <div class="controls">
    <div>
      <label>Image quality</label>
      <input type="range" id="quality" min="0.3" max="1" step="0.05" value="0.9" />
      <span id="qualityVal" style="font-size:.85rem">90%</span>
    </div>
    <div>
      <label>Resolution</label>
      <select id="resolution">
        <option value="1">Standard (1x)</option>
        <option value="1.5">High (1.5x)</option>
        <option value="2" selected>Very High (2x)</option>
        <option value="3">Ultra (3x)</option>
      </select>
    </div>
  </div>

  <div id="progressWrap">
    <div class="bar"><div id="barFill"></div></div>
    <div id="progressText"></div>
  </div>

  <div class="actions" id="actionBar" style="display:none">
    <button class="btn-primary" id="downloadAllBtn">⬇ Download All (ZIP)</button>
    <button class="btn-ghost" id="resetBtn">↺ Convert another PDF</button>
  </div>

  <div id="gallery"></div>
  <footer>Powered by PDF.js & JSZip — no files ever leave your device.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const dropZone   = document.getElementById('dropZone');
const fileInput  = document.getElementById('fileInput');
const gallery    = document.getElementById('gallery');
const progressWrap = document.getElementById('progressWrap');
const barFill    = document.getElementById('barFill');
const progressText = document.getElementById('progressText');
const actionBar  = document.getElementById('actionBar');
const qualityEl  = document.getElementById('quality');
const qualityVal = document.getElementById('qualityVal');
const resEl      = document.getElementById('resolution');

let pdfDoc = null, results = [], baseName = 'document';

qualityEl.addEventListener('input', () =>
  qualityVal.textContent = Math.round(qualityEl.value * 100) + '%');
qualityEl.addEventListener('change', () => { if (pdfDoc) convert(); });
resEl.addEventListener('change', () => { if (pdfDoc) convert(); });

// --- File picking / drag & drop ---
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });

['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.add('dragover');
}));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
}));
dropZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) loadPDF(file);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

// --- Load & convert ---
async function loadPDF(file) {
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    alert('Please select a PDF file.'); return;
  }
  baseName = file.name.replace(/\.pdf$/i, '');
  try {
    const buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    convert();
  } catch (err) {
    if (err && err.name === 'PasswordException') {
      const pw = prompt('This PDF is password protected. Enter password:');
      if (pw) {
        const buf2 = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: buf2, password: pw }).promise;
        convert();
      }
    } else {
      alert('Could not read this PDF. ' + err.message);
    }
  }
}

async function convert() {
  gallery.innerHTML = ''; results = [];
  actionBar.style.display = 'none';
  progressWrap.style.display = 'block';
  const scale = parseFloat(resEl.value);
  const quality = parseFloat(qualityEl.value);
  const total = pdfDoc.numPages;

  for (let i = 1; i <= total; i++) {
    progressText.textContent = `Converting page ${i} of ${total}…`;
    const blob = await renderPageToJPG(i, scale, quality);
    const name = `${baseName}-page-${i}.jpg`;
    results.push({ name, blob });
    addCard(name, blob, i);
    barFill.style.width = (i / total * 100) + '%';
  }
  progressText.textContent = `✅ Done — ${total} page${total > 1 ? 's' : ''} converted.`;
  actionBar.style.display = 'flex';
}

async function renderPageToJPG(pageNum, scale, quality) {
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';                       // JPG has no transparency
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
}

// --- UI helpers ---
function addCard(name, blob, pageNum) {
  const url = URL.createObjectURL(blob);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${url}" alt="Page ${pageNum}" loading="lazy">
    <div class="meta">
      <span>Page ${pageNum} · ${formatSize(blob.size)}</span>
      <a href="${url}" download="${name}">⬇ JPG</a>
    </div>`;
  gallery.appendChild(card);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

document.getElementById('downloadAllBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadAllBtn');
  btn.disabled = true; btn.textContent = 'Zipping…';
  const zip = new JSZip();
  results.forEach(r => zip.file(r.name, r.blob));
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  saveBlob(zipBlob, baseName + '-images.zip');
  btn.disabled = false; btn.textContent = '⬇ Download All (ZIP)';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  pdfDoc = null; results = [];
  gallery.innerHTML = '';
  fileInput.value = '';
  actionBar.style.display = 'none';
  progressWrap.style.display = 'none';
  barFill.style.width = '0%';
});

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
</script>
</body>
</html>
